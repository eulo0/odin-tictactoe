<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <p id="title">Tic Tac Toe</p>
    <div id="scoreboard">
        <div class="score-tile">
            <p class="player-label">Player 1</p>
            <p id="player1-score">0</p>
        </div>
        <div class="score-tile">
            <p class="player-label">Ties</p>
            <p id="ties">0</p>
        </div>
        <div class="score-tile">
            <p class="player-label">Player 2</p>
            <p id="player2-score">0</p>
        </div>
    </div>
    <div id="container"> 
        <div id="tile0" class="tile">X</div>
        <div id="tile1" class="tile">X</div>
        <div id="tile2" class="tile">X</div>
        <div id="tile3" class="tile">X</div>
        <div id="tile4" class="tile">X</div>
        <div id="tile5" class="tile">X</div>
        <div id="tile6" class="tile">X</div>
        <div id="tile7" class="tile">X</div>
        <div id="tile8" class="tile">X</div>
    </div>
</body>
</html>
